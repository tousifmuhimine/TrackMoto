services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackmoto-app
    ports:
      - "3000:3000"
    environment:
      - "DATABASE_URL=postgresql://trackmoto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/trackmoto?schema=public"
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: trackmoto-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trackmoto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trackmoto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackmoto -d trackmoto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
