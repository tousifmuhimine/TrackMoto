services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackmoto-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-trackmoto-bike-workshop-secret-key-2026}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-TrackMotors}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-carboneight1122@}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: trackmoto-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trackmoto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackmoto_secure_password_2026}
      POSTGRES_DB: trackmoto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackmoto -d trackmoto"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
