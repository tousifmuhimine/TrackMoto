services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackmoto-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - "DATABASE_URL=postgresql://trackmoto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/trackmoto?schema=public"
      - NODE_ENV=production
      - "NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
      - NEXT_PUBLIC_APP_NAME=TrackMoto
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: trackmoto-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trackmoto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trackmoto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackmoto -d trackmoto"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
